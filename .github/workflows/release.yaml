name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 or v1.2.0 (empty: derive from the commits since the last release)"
        required: false
        type: string
      dry_run:
        description: "Dry run: resolve the version and print the plan, change nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/simple-tag-and-release.yaml@ba5f6ec7596a5eb306ad2f7511a888ec8dde6d53 # v1.4.0
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
