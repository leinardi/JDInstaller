version: 2

# Every ecosystem uses chore(deps): none of them changes what the playbooks install, so a bump is
# not a release on its own.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # requirements-ci.txt only: the ansible-core the CI syntax check runs with.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      python:
        patterns:
          - "*"
