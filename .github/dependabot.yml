version: 2

# Every ecosystem uses chore(deps): none of them changes what the playbooks install, so a bump is
# not a release on its own.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # requirements-ci.txt only: the ansible-core the make targets run through uvx.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]
    groups:
      python:
        patterns:
          - "*"
