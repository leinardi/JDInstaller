---
- name: Ubuntu Work Playbook
  hosts: localhost
  roles:
    - role: amethyst_mod_manager
      tags: amethyst_mod_manager
      when: amethyst_mod_manager_enabled | bool
    - role: discord
      tags: discord
      when: discord_enabled | bool
    - role: gamemode
      tags: gamemode
      when: gamemode_enabled | bool
    - role: mangohud
      tags: mangohud
      when: mangohud_enabled | bool
    - role: steam
      tags: steam
      when: steam_enabled | bool
